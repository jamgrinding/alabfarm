<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALabFarm - Coming Soon</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #2b1702; 
            font-family: 'Instrument Sans', sans-serif;
            height: 100vh;
            height: 100dvh; 
            display: flex;
            overflow: hidden;
        }

        .lines-container {
            width: 61px;
            height: 100%;
            flex-shrink: 0;
        }

        .lines-container img {
            width: 100%;
            height: 100%;
            object-fit: fill; 
        }

        .content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            padding: 70px 24px 20px 16px;
        }

        .logo {
            width: 254px;
            max-width: 100%;
            height: auto;
        }

        .silicon-valley {
            color: #37FF8B;
            font-size: 20px;
            font-weight: 400;
            letter-spacing: -0.09em; 
            margin-top: 4px;
            margin-left: 8px; 
        }

        .description {
            color: #FFFFFF;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: -0.05em; 
            text-align: right;
            margin-top: 32px; 
            line-height: 1.3;
            max-width: 254px; 
        }
    </style>
</head>
<body>

    <div class="lines-container">
        <img src="group lines.png" alt="Vertical lines">
    </div>

    <div class="content">
        <img src="Landing Logo.png" alt="ALabFarm Logo" class="logo">
        <div class="silicon-valley">Silicon Valley</div>
        <div class="description">
            Premium garments made in America<br>
            coming soon
        </div>
    </div>

</body>
</html>
